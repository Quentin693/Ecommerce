name: luxedrive-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: luxury_cars
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: luxury_cars
      JWT_SECRET: ${JWT_SECRET:-luxedrive-local-dev-only-change-me}
      JWT_EXPIRATION: 7d
      PORT: 3001
      CORS_ORIGIN: http://localhost:3080,http://localhost:3000
      TYPEORM_SYNCHRONIZE: "true"
    ports:
      - '3011:3001'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3011
    ports:
      - '3080:3000'
    depends_on:
      - api

volumes:
  postgres_data:
